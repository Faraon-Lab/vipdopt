#* Debug

# start_from_step: 0          # 0 if running entire file in one shot      #delete
# shelf_fn: 'save_state'      #delete

# restart_epoch: 0            # Both 0 if not restarting  #delete
# restart_iter: 0 #2 #299         #delete

pull_sim_files_from_debug_folder: False

#* File and Simulator Options
#! do not include spaces in filepaths passed to linux
# Lumapi filepaths are found in lumerical.cfg

simulator_name: 'LumericalFDTD'
simulator_dimension: '2D'       # capital D please      #2.5D #3D
simulator_max_wait_time: 3600   # seconds
# use_autograd: False     #delete
use_GUI_license: True

#* Back-Compatibility
#delete
convert_existing: False     # Are we converting a previous file that didn't have the mode overlap FoM?

#* Mesh

mesh_spacing_um: 0.1 # 0.017          # NOTE: Same mesh spacing is used for ALL dimensions.

#! TODO: Rewrite for blurring. ========================
use_smooth_blur: False
min_feature_size_um: 0.03  # used only for blurring
#! ====================================================

#* Optical

background_index: 1
min_device_index: 1
max_device_index: 1.52  # this may be overridden if dispersion data is available

init_permittivity_0_1_scale: 0.5
binarize_3_levels: False      #! new
# Three-material levels
do_normalize: False

# focal_plane_center_lateral_um: 0      #delete

#* Device

# geometry_spacing_minimum_um: 0.051    # NOTE: UNUSED
# geometry_spacing_lateral_um: 0.102 # 0.085 # 0.051      #delete

voxel_size_x_um: 0.1
voxel_size_y_um: 0.1              # y ignored in 2D
voxel_size_z_um: 0.1

# device_scale_um: 0.102        #delete
# This is only used to scale vertical dimensions: focal length, device vertical layer voxels, and FDTD gap sizes.
# Edit: device_scale_um is just meant to arbitrarily scale a few things it's not necessarily ONLY used for vertical dimensions
# TODO: At present this is used to determine the device voxels in the vertical. We should track down what else uses device_scale_um

device_size_x_um: 100
device_size_y_um: 1          # doesn't matter for 2d
device_size_z_um: 30
# origin (x,y) is assumed to be the center of the device.
device_vertical_minimum_um: 0
origin_displacement_um: [0, 0]  # x,y

# Layering
layering_axis: 2        # [0,1,2] -> [x,y,z]
# num. voxels will be merged into num_vertical_layers as necessary
num_layers: 10
# num_vertical_layers: 20 # 10
# layer_height_um: 0.102 # 0.204 #0.051 * 4 #0.017 * 8   #delete


#* Spacers
# Assuming we don't have something like vertically blurring - i.e. - each layer is controlled independently
# self.get_layer_idxs() of the Layering filter returns a dictionary with region names as keys and [start, end) indices as values.
# Customize as needed. e.g. 3 layers, height 4, 2 layers, height 2
# ->
num_spacers: 0 #9      #! 20241004: By default right now the derived_simulation_properties.j2 sets it to (num_layers - 1)
spacer_height_um: 0.510
spacer_density: 0

#* Surroundings

# Structure the following list such that the last entry is the last medium above the device.
substrates_above_device: [{'name': 'glass_substrate', 'thickness_um': 2.5, 'material': "SiO2 (Glass) - Palik"},
                # {'name': 'sapphire_substrate', 'thickness_um': 2.5, 'material': 1.6516}
                ]
# todo: edit to take custom refractive indices

num_sidewalls: 0 #4
sidewall_material: 'etch'
sidewall_extend_pml: False
sidewall_extend_focalplane: True
sidewall_thickness_um: 0.085          # only needed if sidewall_extend_pml is False - 0.085 is a good value based on Study #20
sidewall_vertical_minimum_um: -0.765    # only needed if sidewall_extend_focalplane is False; describes how far down from the device they extend

#* FDTD
fdtd_simulation_time_fs: 600 #3000
# Boundary conditions
boundary_conditions: 'pml' # 'periodic'

# NOTE: If this needs troubleshooting, open Lumerical in a GUI in the environment you intend to run this in, and check the resource config job launch presets.
# #! do not include spaces in filepaths passed to linux
lum_mpi_exe: 'C:\Program Files (x86)\IntelSWToolsMPI\compilers_and_libraries_2020.4.321\windows\mpi\intel64\bin\mpiexec.exe' #"/central/home/ifoo/lumerical/2022a_r24/mpich2/nemesis/bin/mpiexec" # "/central/software/mpich/4.0.0/bin/mpirun"
lum_solver_exe: 'C:\Program Files\Lumerical\v222\bin\fdtd-engine-impi.exe' # "/central/home/ifoo/lumerical/2022a_r24/bin/fdtd-engine-mpich2nem" # "/central/home/tmcnicho/lumerical/v232/bin/fdtd-engine-mpich2nem"
lum_nprocs: 8

#* Forward (Input) Source

weight_by_individual_wavelength: True   # At present this changes nothing.
use_gaussian_sources: True # False

use_airy_approximation: True
f_number: 2.2
airy_correction_factor: 0.84  # Approximation of central Airy lobe using a Gaussian profile
# See https://en.wikipedia.org/wiki/Airy_disk#Approximation_using_a_Gaussian_profile:~:text=to%20the%20intensity.-,Approximation%20using%20a%20Gaussian%20profile,-%5Bedit%5D
beam_size_multiplier: 1   #! new

source_angle_theta_vacuum_deg: 0 #40
source_angle_phi_deg: 0

# General polarized source information
xy_phi_rotations: [0, 90] #2D, apply this to polarization angle of the forward source.
xy_adjtheta_rotations: [90, 0]  #2D settings. 3D is: [0, 90] applied to phi, and theta=90 for all
# xy_pol_rotations: [0, 90]
xy_names: ['x', 'y']

use_source_aperture: True

#* Adjoint Source
#! TODO: Rewrite for arbitrary focal-point locations ======================

num_focal_spots: 2              # only used to calculate num_adjoint_sources
adj_angles_theta_deg: [-30, 20] # Angle of incidence of adjoint source, also sets the target deflection angle

# Determine which adjoint source goes to each dispersive range
# Each dispersive range itself contains a map for how the wavelength buckets correspond to which specific adjoint sources on the focal plane.
dispersive_range_to_adjoint_src_map: [
  [ 0, 1, 2, 3 ]
]

# Determine which dispersive range goes to each adjoint source
adjoint_src_to_dispersive_range_map: [
  0,
  0,
  0,
  0
]
#! ==================================================================

#* Spectral
add_infrared: False
lambda_min_um: 4.3 # 0.375
lambda_max_um: 4.7 # 0.725
lambda_min_eval_um: 4.2 # 0.375
lambda_max_eval_um: 4.8 # 0.725

#* Spectral dispersion and polarization selectivity information
lambda_center_um: 4.5
num_opt_dispersion_freqs: 5     # Number of frequencies / frequency bins for explicit optimization  within the wavelength range
dispersion_factors: {'adj_src_0x': 2,
                     'adj_src_1y': 2}
# Dispersion parameter, >1 is hyperdispersive, =1 is regular, and =0 is zero-dispersion
                            # Polarization 1(x), Polarization 2(y)



# Determine the polarizations that will be directed to each focal area
polarizations_focal_plane_map: [ ['x', 'y'], ['x', 'y'], ['x', 'y'], ['x', 'y'] ]
weight_focal_plane_map_performance_weighting: [ 1.0, 1.0, 1.0, 1.0 ]
weight_focal_plane_map: [ 1.0, 1.0, 1.0, 1.0 ]

do_green_balance: False #True
shuffle_green: False #True

polarization_name_to_idx: { 'x':0, 'y':1, 'z':2 }


num_bands: 2 # 3
num_points_per_band: 15 #5 # 20 #15
desired_peaks_per_band_um: [ 0.475, 0.625 ]
# desired_peaks_per_band_um: [ 0.45, 0.55, 0.65 ]
# desired_peaks_per_band_um: [ 0.48, 0.52, 0.59 ]
# desired_peaks_per_band_um: [ 0.48, 0.53, 0.62 ]
explicit_band_centering: True

num_dispersive_ranges: 1

infrared_center_um: 0.94
do_rejection: False
softplus_kappa:  2

# Add PDAF Functionality
add_pdaf: False
pdaf_angle_phi_degrees: 45
pdaf_angle_theta_degrees: -8
pdaf_adj_src_idx: 0


#* Optimization

enforce_xy_gradient_symmetry: False #True

# Alternative is to weight by focal intensity - need to check max intensity weighting
weight_by_quadrant_transmission: True

#! 20230220 - Empirically, 300 iterations is usually the right number to get a stable optimization FoM.
total_num_iterations:  80 #40 #20 # 1  #300
epoch_list: [0, 8, 16, 24, 32, 40, 48, 56, 64, 72, 80] # [0, 4, 8, 12, 16, 20] # [0,1]  # [0,30,60,90,120,150,180,210,240,270,300]

optimizer: "AdamOptimizer"
optimizer_settings: {
        "step_size": 0.01,
        "betas": [
            0.9,
            0.999
        ],
        "eps": "1e-8",
        "moments": [
            0.0,
            0.0
        ]
}

# [DEPRECATED] - Used for ensuring incremental change in standard gradient design ===============
epoch_start_design_change_max: 0.15
epoch_end_design_change_max: 0.05
epoch_start_design_change_min: 0.05
epoch_end_design_change_min: 0
# ===============================================================================================

# Layering changes with each epoch - scales to epoch list.
# True or empty list: automatic scaling
# False: Same num. layers throughout.
# Otherwise: Custom setting
num_layers_per_epoch: False            # [32, 32, 24, 24, 12, 12, 8, 8]

fom_types: ['transmission', 'overall_transmission', 'intensity']
optimization_fom: 'intensity'    # Has to be one from the fom_types list

#! new-------
reinterpolate_permittivity: True # True
reinterpolate_permittivity_factor: 2 # 15 #8 #1#5   # Must be 1 if reinterpolate_permittivity is False
reinterpolate_type: 'nearest' #'linear'   #NOTE: In the end we implement both anyway. Deprecated


#! new-------
border_optimization: False

border_constant_width: 2 # False if not used, integer num. pixels if used
border_constant_density: 0

layer_gradient: False
flip_gradient: False



#!* NEW STUFF JULY 2023


#* Border aperiodic
evaluate_bordered_extended: False # True
# You only see this in the evaluate code block, so can ignore. But also, part of it is in
# the restart block in order to truncate the cur_design_variable?


