#* Evaluation Settings
# What kind of source and boundary condition are we using to evaluate this situation?
eval_source: 'periodic_plane' # options: {'tfsf', 'gaussian', 'periodic_plane'}
eval_boundary_conditions: 'auto' # options: {'pml', 'periodic'}. 'auto' will make it match boundary_conditions value above
# Determine the global value that all power settings are normalized against
eval_normalize_against: 'input_power'   #options: {'input_power', 'sourcepower', 'power_sum', 'unity', 'uniform_cube'}
# Spectral
eval_change_wavelength_range: True
# Devices in Array
eval_device_array_shape: [1,1] # [3,3]            # Describes side lengths of the array of devices to be simulated